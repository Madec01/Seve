 *
 * Script CLASSIQUE (pas un module), recopié tel quel dans index.html et dev.html par tools/build.js, juste
 * avant le chargeur (src/loader.js). Même prudence que le chargeur (var, pas de fonctions fléchées) : il

 *

 *  1. Décide si l'intro se joue : oui à chaque ouverture du jeu, sauf « ?nointro », réglage « Intro au
 *     démarrage » désactivé (Options), « ?debug=1 » ou navigateur piloté par un robot de test
 *     (navigator.webdriver) — « ?intro=1 » la force malgré ces deux derniers cas.
 *     Oui → classe « intro-on » sur <html> AVANT le premier affichage : l'écran-titre « Touchez pour
 *     commencer » (#intro, css/intro.css) recouvre l'écran de chargement, qui continue dessous.
 *  2. Télécharge le lecteur de l'intro EN PARALLÈLE du jeu (index.html : dist/intro.<empreinte>.js ;
 *     dev.html : import() de src/intro/player.js) : il ne retarde jamais le chargement du jeu.
 *  3. Au toucher (tout l'écran ; Entrée ou Espace au clavier) : crée et débloque l'AudioContext DU JEU
 *     (window.__fermeIntro.ctx, repris par src/audio/audio.js), puis lance l'animation avec le son
 *     (volume des effets du joueur ; sans son si le son est coupé ; image fixe si mouvement réduit).
 *     Toucher pendant l'animation la passe (fondu rapide). Lecteur absent au bout de 4 s : pas d'intro.
 *  4. Relais avec le jeu (src/main.js) : window.__fermeIntro.onGameReady(go) — le jeu, une fois prêt,
 *     confie son passage au menu. Il est appelé au début du fondu final (le menu apparaît sous l'intro :
 *     fondu enchaîné), ou tout de suite si l'intro est déjà finie (l'écran de chargement avait pris le
 *     relais, sans saut : même fond).
 *  5. window.__fermeIntro.abort() : le chargeur l'appelle s'il affiche son aide (« Réparer le jeu ») :
 *     l'intro s'efface pour ne rien cacher.
 *
 * État (window.__fermeIntro.state) : 'off' | 'title' | 'starting' | 'playing' | 'fading' | 'done'.

  'use strict';
  var BUILD = window.__FERME_BUILD__ || {};
  var SETTINGS_KEY = 'une-annee-a-la-ferme.settings';
  var PLAYER_WAIT = 4000;
  var root = document.documentElement;

  var api = {
    active: false,
    state: 'off',
    reason: '',
    ctx: null,
    reduced: false,
    volume: 0,
    onGameReady: function (go) { run(go); },
    abort: function () {},
    skip: function () {},
    times: {}, // (vérifications) instants (performance.now) du toucher, du début du fondu, de la fin
  };
  window.__fermeIntro = api;

  function run(fn) { try { fn(); } catch (e) { setTimeout(function () { throw e; }, 0); } }

  // ── Décision ────────────────────────────────────────────────────────────────────────
  var settings = {};
  try { settings = JSON.parse(window.localStorage.getItem(SETTINGS_KEY) || '{}') || {}; } catch (e) { settings = {}; }
  var params;
  try { params = new URLSearchParams(location.search); } catch (e) { params = null; }
  var has = function (k) { return !!(params && params.has(k)); };
  var get = function (k) { return params ? params.get(k) : null; };

  var reason = '';

  else if (has('nointro') || get('intro') === '0') reason = '?nointro';
  else if (settings.intro === false && !forced) reason = 'réglage';
  else if (!forced && get('debug') === '1') reason = '?debug=1';
  else if (!forced && navigator.webdriver) reason = 'robot de test';

  api.state = 'title';

  var playerWaiters = [];

    if (!window.__fermeIntroPlayer) return;
    var list = playerWaiters;
    playerWaiters = [];
    for (var i = 0; i < list.length; i++) list[i]();
  }
  window.addEventListener('ferme-intro-player', playerReady);
  function loadPlayer() {
    try {
      if (BUILD.intro.module) {

        });

  }

  var gameGo = null;
  function callGo() {
    if (!gameGo) return;
    var go = gameGo;
    gameGo = null;
    run(go);
  }
  api.onGameReady = function (go) {
    gameGo = go;
    if (api.state === 'fading' || api.state === 'done') callGo();
  };

  // ── Écran-titre, toucher, animation ──────────────────────────────────────────────────
  var el = null;
  var controller = null;
  function fadeStarted() {
    if (api.state === 'done') return;
    api.state = 'fading';
    stamp('fading');
    callGo();
  }
  function finish() {
    if (api.state === 'done') return;
    fadeStarted();
    api.state = 'done';
    stamp('done');
    root.className = root.className.replace(/\s*\bintro-(on|reduced)\b/g, '');
    if (el) {
      el.setAttribute('hidden', '');
      el.style.opacity = '';
      if (document.activeElement === el) { try { el.blur(); } catch (e) { /* */ } }
    }

    document.removeEventListener('visibilitychange', onVisibility);
  }

    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    var ctx = api.ctx;
    try {
      if (!ctx) { ctx = new AC(); api.ctx = ctx; }

      // petit tampon silencieux : débloque aussi les anciens Safari
      var b = ctx.createBuffer(1, 1, 22050);
      var src = ctx.createBufferSource();
      src.buffer = b;
      src.connect(ctx.destination);
      src.start(0);
    } catch (e) { /* sans son */ }
    return ctx;
  }

  function startPlayer() {
    var P = window.__fermeIntroPlayer;
    if (!P || api.state !== 'starting') { if (!P) finish(); return; }
    var canvas = el.querySelector('.intro-canvas');
    try {
      controller = P.play({
        root: el,
        canvas: canvas,
        ctx: api.volume > 0 ? api.ctx : null,
        volume: api.volume,
        reduced: api.reduced,
        onFadeStart: fadeStarted,
        onDone: finish,
      });
      api.state = 'playing';
    } catch (e) {
      try { console.warn('[intro] ' + (e && e.message ? e.message : e)); } catch (e2) { /* */ }
      finish();
    }
  }

  var startedAt = 0;
  function start() {
    if (api.state !== 'title') return;
    api.state = 'starting';
    startedAt = Date.now();
    stamp('tap');
    unlockAudio();
    if (el) el.className += ' is-tapped';
    if (window.__fermeIntroPlayer) { startPlayer(); return; }
    var timer = setTimeout(function () { if (api.state === 'starting') finish(); }, PLAYER_WAIT);
    playerWaiters.push(function () { clearTimeout(timer); startPlayer(); });
  }

  api.skip = function () {
    if (api.state === 'playing' && controller) controller.skip();
    else if (api.state === 'starting') finish();
  };
  api.abort = function () {
    if (api.state === 'title' || api.state === 'starting') finish();
    else if (api.state === 'playing') api.skip();
  };

  function onTap(e) {
    if (api.state === 'title') {
      if (e.type === 'pointerup' && e.pointerType === 'mouse' && e.button !== 0) return;
      start();
    } else if (api.state === 'playing' && Date.now() - startedAt > 500) api.skip(); // (pas le toucher qui l'a lancée)
    if (e.cancelable && e.type !== 'pointerup') e.preventDefault();
  }
  function onKey(e) {
    if (api.state === 'title' && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')) { e.preventDefault(); start(); }
    else if (api.state === 'playing' && e.key !== 'Tab') { e.preventDefault(); api.skip(); }
  }
  function onVisibility() { if (document.hidden && api.state === 'playing') api.skip(); }

  function bind() {
    el = document.getElementById('intro');
    if (!el) { finish(); return; }
    el.removeAttribute('hidden');
    // Chrome Android : seuls touchend / pointerup / click débloquent l'audio au doigt (pas pointerdown)
    el.addEventListener('pointerup', onTap);
    el.addEventListener('touchend', onTap, { passive: false });
    el.addEventListener('click', onTap);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('visibilitychange', onVisibility);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();

/* Chargeur et garde-fou de démarrage de « Une année à la ferme ».
 *
 * Script CLASSIQUE (pas un module), recopié tel quel dans index.html et dev.html par tools/build.js
 * (jamais chargé comme fichier séparé : rien qui puisse manquer ou dater d'une autre version).
 * Écrit en JavaScript prudent (var, pas de fonctions fléchées) : il doit pouvoir s'exécuter et
 * afficher une erreur lisible même sur un navigateur ancien.
 *
 * Il lit window.__FERME_BUILD__ (écrit juste avant par tools/build.js) :
 *   { id, js: { src, sha, size }, css: [...] }      jeu empaqueté (index.html)
 *   { id: 'dev', dev: true, module: 'src/main.js' }  modules non empaquetés (dev.html)
 *
 * Rôle :
 *  1. Télécharge le paquet du jeu (dist/game.<empreinte>.js) en montrant la progression dans la
 *     jauge, vérifie son empreinte SHA-256, puis l'exécute. En cas d'échec (réseau coupé, fichier
 *     tronqué ou altéré) : jusqu'à 3 nouveaux essais espacés (1 s, 2,5 s, 5 s), en contournant le
 *     cache (« ?r=n », cache: 'reload').
 *  2. Feuille de style : nouveaux essais de la même façon si elle ne se charge pas ; le jeu ne
 *     démarre qu'une fois le style en place (les mesures de mise en page en dépendent).
 *  3. Garde-fou : erreur de script, ou plus aucun progrès pendant 20 s → si une version plus
 *     récente du service worker attend, on l'active et on recharge une seule fois (repère dans
 *     sessionStorage : jamais de boucle) ; sinon, bouton « Réparer le jeu » et zone « Détails »
 *     (le vrai message d'erreur, à photographier).
 *  4. window.__repairGame() (bouton « Réparer le jeu », ici et dans les options) : désinscrit le
 *     service worker, vide les caches ferme-*, retélécharge la page et chaque fichier qu'elle
 *     désigne en contournant le cache HTTP (fetch cache: 'reload'), puis recharge la page avec
 *     « ?r=<heure> » (retiré de l'adresse au chargement suivant). localStorage (progression,
 *     partie) n'est jamais touché.
 *
 * L'intro « MG studios » (portillon src/intro/gate.js, recopié juste avant ce script) se joue par-dessus
 * l'écran de chargement pendant que ce chargeur continue : elle ne change rien à son travail ; s'il doit
 * afficher son aide, il l'efface (window.__fermeIntro.abort()).
 *
 * Interface pour le jeu (src/main.js) : window.__bootProgress(0..1) (suite du chargement, après
 * le paquet), window.__bootOk() (écran « Prêt ! »), window.__bootFail(err).
 */

  var KEY = 'ferme.bootRecovery';

  var failed = false;

  function tried() { try { return !!sessionStorage.getItem(KEY); } catch (e) { return true; } }
  // Étapes normales : console.info ; échecs et nouveaux essais : console.warn (une partie qui démarre
  // bien ne laisse aucun avertissement dans la console).
  function note(msg, problem) {

    log.push(line);

      lastProgress = Date.now();

    whenDom(function () {

  function details() {

    var lines = [
      'Version : ' + BUILD.id + (BUILD.dev ? ' (développement)' : ''),
      'Adresse : ' + location.href,
      'Service worker : ' + sw + ' — en ligne : ' + (navigator.onLine === false ? 'non' : 'oui'),
      'Navigateur : ' + navigator.userAgent,
      'Écran : ' + window.innerWidth + ' × ' + window.innerHeight + ' (×' + (window.devicePixelRatio || 1) + ')',
      '',
    ];

  }

    whenDom(function () {
      var pre = $('#boot-details-text');
      if (pre) pre.textContent = details();
    });
  }

  function showHelp(message) {

    try { if (window.__fermeIntro && window.__fermeIntro.active) window.__fermeIntro.abort(); } catch (e) { /* */ }

      }

      shown = true;
      var p = document.createElement('p');
      p.className = 'loading-error boot-help';
      p.textContent = 'Le jeu ne démarre pas ? « Réparer le jeu » retélécharge le jeu et recharge la page (votre progression est conservée).';
      var b = document.createElement('button');
      b.type = 'button';
      b.id = 'boot-repair';
      b.className = 'btn btn--small boot-repair';
      b.textContent = 'Réparer le jeu';
      b.onclick = function () { b.disabled = true; b.textContent = 'Réparation…'; window.__repairGame(); };
      var d = document.createElement('details');
      d.className = 'boot-details boot-help';
      var s = document.createElement('summary');
      s.textContent = 'Détails';
      var pre = document.createElement('pre');
      pre.id = 'boot-details-text';

      d.appendChild(pre);

      }).catch(function () {}));

    });
  };

  // ── Garde-fou : nouvelle version du service worker, sinon « Réparer » ────────────────
  function reload() { if (!ok) location.reload(); }
  function recover(message) {
    if (ok) return;
    if (busy) { showHelp(message); return; }
    busy = true;
    if (tried() || !('serviceWorker' in navigator)) { showHelp(message); return; }
    navigator.serviceWorker.getRegistration(BASE).then(function (reg) {
      if (!reg || ok) { showHelp(message); return; }
      return reg.update().catch(function () {}).then(function () {
        var w = reg.waiting || reg.installing;
        if (!w) { showHelp(message); return; }
        note('nouvelle version du service worker trouvée : activation');
        var activate = function (worker) {
          if (ok) return;
          store(String(Date.now()));
          navigator.serviceWorker.addEventListener('controllerchange', reload);
          worker.postMessage({ type: 'SKIP_WAITING' });
          setTimeout(reload, 5000);
        };
        if (w.state === 'installed') { activate(w); return; }
        var done = false;
        var t = setTimeout(function () { if (!done) { done = true; showHelp(message); } }, 60000);
        w.addEventListener('statechange', function () {
          if (done) return;
          if (w.state === 'installed' || w.state === 'activated') { done = true; clearTimeout(t); activate(w); }
          else if (w.state === 'redundant') { done = true; clearTimeout(t); showHelp(message); }
        });
      });
    }).catch(function () { showHelp(message); });
  }

  function fail(err, where) {
    if (ok) return;
    var msg = errText(err);
    var e = err && err.error ? err.error : err;
    var where2 = '';
    if (e && e.stack && where !== 'paquet' && where !== 'style') { // (erreurs du jeu : où ?)
      var frames = String(e.stack).split('\n');
      for (var i = 0; i < frames.length; i++) if (/:\d+:\d+/.test(frames[i])) { where2 = ' — ' + frames[i].trim().replace(BASE, ''); break; }
    }
    note('ÉCHEC' + (where ? ' (' + where + ')' : '') + ' : ' + msg + where2);
    failed = true;
    setText('Impossible de charger le jeu.');
    recover(msg);
  }

  window.__bootProgress = function (v) {
    setProgress(JS_SHARE + (1 - JS_SHARE) * (Number(v) || 0));
  };
  window.__bootOk = function () {
    if (ok) return;
    ok = true;
    store(null);
    clearInterval(watch);
    setProgress(1);
    note('jeu prêt');
    whenDom(function () {
      var nodes = document.querySelectorAll('.boot-help, .boot-repair');
      for (var i = 0; i < nodes.length; i++) nodes[i].parentNode.removeChild(nodes[i]);
      var err = $('#loading .loading-error');
      if (err && failed) { err.hidden = true; err.textContent = ''; }
    });
  };
  window.__bootFail = function (err) { fail(err || 'échec du démarrage', 'jeu'); };

  window.addEventListener('error', function (e) {
    if (ok) return;
    var t = e.target;
    if (e instanceof ErrorEvent || e.error) { fail(e.error && e.error.message ? e : (e.message || e.error), 'script'); return; }
    // (Les balises de loadByTag gèrent elles-mêmes leurs nouveaux essais ; le lecteur de l'intro, data-intro,
    // est facultatif : sans lui, le jeu démarre sans intro.)
    if (t && t.tagName === 'SCRIPT' && !t.hasAttribute('data-boot-retry') && !t.hasAttribute('data-intro')) fail('script introuvable : ' + (t.src || ''), 'script');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    if (ok) return;
    note('promesse rejetée : ' + errText(e.reason));
  });

  // Plus aucun progrès pendant STALL_MS → garde-fou (sans rien interrompre : si le chargement
  // repart, le jeu démarre normalement et l'aide disparaît).
  var lastProgress = Date.now();
  var watch = setInterval(function () {
    if (ok) { clearInterval(watch); return; }
    if (Date.now() - lastProgress > STALL_MS && !busy) {
      note('aucun progrès depuis ' + Math.round(STALL_MS / 1000) + ' s (' + Math.round(progress * 100) + ' %)');
      recover('Le chargement semble bloqué.');
    }
  }, 1000);

  // ── Feuilles de style (liens <link data-boot-css>, qui appellent __bootCss) ───────────
  var cssPending = 0;
  var cssBroken = false; // plus d'essai possible : le jeu ne démarre pas sans style
  var cssWaiters = [];
  var cssTries = {};
  function cssDone() {
    if (cssPending > 0 || cssBroken) return;
    var list = cssWaiters;
    cssWaiters = [];
    for (var i = 0; i < list.length; i++) list[i]();
  }
  function whenCss(fn) { cssWaiters.push(fn); whenDom(checkCss); }
  function checkCss() {
    var links = document.querySelectorAll('link[data-boot-css]');
    var pending = 0;
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      if (l.__bootDone) continue;
      if (l.sheet) { l.__bootDone = true; continue; }
      pending++;
    }
    cssPending = pending;
    cssDone();
  }
  window.__bootCss = function (link, success) {
    if (link.__bootDone) return;
    var key = link.getAttribute('data-boot-css') || link.href;
    if (success) {
      link.__bootDone = true;
      whenDom(checkCss);
      return;
    }
    var n = (cssTries[key] || 0) + 1;
    cssTries[key] = n;
    link.__bootDone = true; // remplacé par un nouveau lien
    if (n > BACKOFF.length) {
      cssBroken = true;
      fail('feuille de style introuvable : ' + key, 'style');
      return;
    }
    note('style ' + key + ' : échec, nouvel essai ' + n + '/' + BACKOFF.length);
    setTimeout(function () {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.setAttribute('data-boot-css', key);
      l.onload = function () { window.__bootCss(l, true); };
      l.onerror = function () { window.__bootCss(l, false); };
      l.href = key + (key.indexOf('?') < 0 ? '?' : '&') + 'r=' + n;
      document.head.appendChild(l);
      if (link.parentNode) link.parentNode.removeChild(link);
    }, BACKOFF[n - 1]);
  };

  // ── Paquet du jeu ─────────────────────────────────────────────────────────────────
  function hex16(buf) {
    var b = new Uint8Array(buf, 0, 8);
    var s = '';
    for (var i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
    return s;
  }

  function download(url, attempt) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var stallTimer = null;
    function arm() {
      clearTimeout(stallTimer);
      stallTimer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    }
    arm();
    var opts = { credentials: 'same-origin', cache: attempt ? 'reload' : 'default' };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' pour ' + url.replace(BASE, ''));
      var size = BUILD.js.size || Number(res.headers.get('Content-Length')) || 0;
      if (!res.body || !res.body.getReader) return res.arrayBuffer();
      var reader = res.body.getReader();
      var chunks = [];
      var got = 0;
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          chunks.push(r.value);
          got += r.value.length;
          arm();
          if (size) setProgress(0.02 + (JS_SHARE - 0.02) * Math.min(1, got / size));
          return pump();
        });
      }
      return pump().then(function () {
        var all = new Uint8Array(got);
        var off = 0;
        for (var i = 0; i < chunks.length; i++) { all.set(chunks[i], off); off += chunks[i].length; }
        return all.buffer;
      });
    }).then(function (buf) {
      clearTimeout(stallTimer);
      return buf;
    }, function (err) {
      clearTimeout(stallTimer);
      if (err && err.name === 'AbortError') throw new Error('téléchargement bloqué (plus rien reçu pendant 15 s)');
      throw err;
    });
  }

  function verify(buf) {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle || !BUILD.js.sha) return Promise.resolve(buf);
    return subtle.digest('SHA-256', buf).then(function (d) {
      var got = hex16(d);
      if (got !== BUILD.js.sha) throw new Error('fichier du jeu incomplet ou altéré (empreinte ' + got + ' au lieu de ' + BUILD.js.sha + ')');
      return buf;
    });
  }

  function run(buf, url) {
    var code = new TextDecoder('utf-8').decode(buf);
    whenDom(function () {
      whenCss(function () {
        if (ok) return;
        note('paquet reçu (' + Math.round(buf.byteLength / 1024) + ' Ko), démarrage');
        setProgress(JS_SHARE);
        var s = document.createElement('script');
        // sourceURL : les erreurs et le débogueur désignent le vrai fichier (et sa carte des sources).
        s.textContent = code + '\n//# sourceURL=' + new URL(url.split('?')[0], BASE).href;
        document.head.appendChild(s);
      });
    });
  }

  function loadBundle(attempt) {
    var src = BUILD.js.src;
    var url = attempt ? src + '?r=' + attempt : src;
    return download(url, attempt).then(verify).then(function (buf) { run(buf, src); }, function (err) {
      if (attempt < BACKOFF.length) {
        note('paquet : ' + errText(err) + ' — nouvel essai ' + (attempt + 1) + '/' + BACKOFF.length);
        setText('Connexion difficile… nouvel essai (' + (attempt + 1) + '/' + BACKOFF.length + ')');
        return new Promise(function (resolve) { setTimeout(resolve, BACKOFF[attempt]); }).then(function () {
          setText('Chargement…');
          return loadBundle(attempt + 1);
        });
      }
      fail(err, 'paquet');
    });
  }

  // Sans fetch en flux (navigateur ancien) : simple balise <script>, avec les mêmes essais.
  function loadByTag(src, attempt, type) {
    whenDom(function () {
      var s = document.createElement('script');
      if (type) s.type = type;
      s.setAttribute('data-boot-retry', '1');
      s.onerror = function () {
        if (attempt < BACKOFF.length) {
          note('script ' + src + ' introuvable — nouvel essai ' + (attempt + 1) + '/' + BACKOFF.length);
          setTimeout(function () { loadByTag(src, attempt + 1, type); }, BACKOFF[attempt]);
        } else fail('script introuvable : ' + src, 'paquet');
      };
      s.src = attempt ? src + '?r=' + attempt : src;
      whenCss(function () { document.head.appendChild(s); });
    });
  }

  // Mode développement (dev.html) : modules non empaquetés, chargés par import() pour obtenir le
  // vrai message d'erreur (fichier manquant, export introuvable…).
  function loadDev(src) {
    whenDom(function () {
      whenCss(function () {
        setProgress(JS_SHARE);
        var dynImport;
        try { dynImport = new Function('u', 'return import(u)'); } catch (e) { dynImport = null; }
        if (!dynImport) { loadByTag(src, 0, 'module'); return; }
        dynImport(new URL(src, BASE).href).catch(function (err) { fail(err, 'modules'); });
      });
    });
  }

  setProgress(0.02);
  if (BUILD.dev) loadDev(BUILD.module || 'src/main.js');
  else if (window.fetch && window.TextDecoder && window.Promise) loadBundle(0);
  else loadByTag(BUILD.js.src, 0);
})();
  </script>
  <link rel="stylesheet" href="dist/game.2d53449a2a.css" data-boot-css="dist/game.2d53449a2a.css" onload="__bootCss(this,true)" onerror="__bootCss(this,false)">
</head>
<body class="is-loading">
  <!-- Scène de la ferme (canvas pixel art), sous toute l'interface : plein écran -->
  <div id="stage">
    <canvas id="scene" aria-label="La ferme"></canvas>
  </div>

  <!-- Barre du haut (2 lignes) : argent, saison, météo, fermage, vitesse -->
  <header id="hud" aria-label="Informations de la ferme"></header>

  <!-- Barre d'onglets en bas : Ferme · Acheter · Bilan · Menu -->
  <nav id="tabbar" aria-label="Navigation"></nav>

  <!-- Feuilles du bas (achats, bilan, graines, fiches) -->
  <div id="sheet-layer"></div>

  <!-- Bandeau (changement de saison, avertissements) et messages -->
  <div id="banner" class="banner" role="status" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Tutoriel : bulle et anneau de surbrillance -->

  <!-- Fenêtres (menus, bilans) -->
  <div id="modal-layer"></div>

  <!-- Infobulle (souris seulement ; au toucher, tout passe par les fiches) -->
  <div id="tooltip" class="tooltip" role="tooltip"></div>

  <!-- Téléphone tenu à l'horizontale -->
  <div id="rotate" class="rotate" aria-hidden="true">
    <div class="rotate-box">
      <div class="rotate-phone"></div>
      <p class="rotate-title">Tournez votre téléphone</p>
      <p class="rotate-text">La ferme se joue en tenant le téléphone à la verticale.</p>
    </div>
  </div>

  <!-- Écran de chargement -->
  <div id="loading" class="loading">
    <div class="loading-box">
      <div class="logo-ribbon"><h1 class="logo-title">Une année à la ferme</h1></div>
      <div class="loading-gauge" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loading-fill"></div>
      </div>
      <p class="loading-text">Chargement…</p>
      <button type="button" class="btn btn--red btn--big loading-start" hidden>Commencer</button>
      <p class="loading-error" hidden></p>
    </div>
  </div>

  <!-- Intro « MG studios », à chaque ouverture du jeu (src/intro/gate.js décide et met « intro-on » sur
       <html> ; css/intro.css) : écran-titre « Touchez pour commencer » (le toucher débloque le son), puis
       l'animation, pendant que le jeu se charge dessous ; fondu enchaîné vers le menu ou l'écran de chargement. -->
  <div id="intro" class="intro" role="button" tabindex="0" aria-label="Touchez pour commencer">
    <canvas class="intro-canvas" aria-hidden="true"></canvas>
    <div class="intro-title">
      <div class="intro-box">
        <div class="logo-ribbon"><p class="logo-title">Une année à la ferme</p></div>
        <p class="intro-sign">Touchez pour commencer</p>
      </div>
    </div>
    <p class="intro-skip" aria-hidden="true">Touchez pour passer</p>
  </div>

  <noscript>
    <p class="noscript">Ce jeu a besoin de JavaScript pour fonctionner.</p>
  </noscript>
</body>
