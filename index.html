<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Une année à la ferme : un jeu de gestion tout doux en pixel art. Tenez une année complète sans faire faillite.">
  <meta name="theme-color" content="#3f2631">
  <title>Une année à la ferme</title>
  <link rel="icon" type="image/png" href="assets/sprites/ui/favicon.png">
  <link rel="preload" href="assets/fonts/PixelifySans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">
  <!-- Scène de la ferme (canvas pixel art) -->
  <div id="stage">
    <canvas id="scene" aria-label="La ferme"></canvas>
  </div>

  <!-- Barre du haut : argent, date, météo, fermage, vitesse, menu -->
  <header id="hud" aria-label="Informations de la ferme"></header>

  <!-- Panneau de droite : investissements et bilan -->
  <aside id="panel" aria-label="Investissements et bilan"></aside>

  <!-- Bandeau (changement de saison, avertissements) et messages -->
  <div id="banner" class="banner" role="status" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Tutoriel : bulle et anneau de surbrillance -->
  <div id="tutorial"></div>

  <!-- Fenêtre près d'une parcelle (graines, ouverture) -->
  <div id="popup" class="popup" aria-hidden="true"></div>

  <!-- Fenêtres (menus, bilans) -->
  <div id="modal-layer"></div>

  <!-- Infobulle -->
  <div id="tooltip" class="tooltip" role="tooltip"></div>

  <!-- Écran de chargement -->
  <div id="loading" class="loading">
    <div class="loading-box">
      <div class="logo-ribbon"><h1 class="logo-title">Une année à la ferme</h1></div>
      <div class="loading-gauge" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loading-fill"></div>
      </div>
      <p class="loading-text">Chargement…</p>
      <button type="button" class="btn btn--red btn--big loading-start" hidden>Commencer</button>
      <p class="loading-error" hidden></p>
    </div>
  </div>

  <noscript>
    <p class="noscript">Ce jeu a besoin de JavaScript pour fonctionner.</p>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
